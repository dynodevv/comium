<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comium</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Title bar / Drag region -->
  <div class="title-bar" id="titleBar">
    <div class="drag-region"></div>
    <div class="window-controls">
      <button class="window-btn minimize" id="btnMinimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect x="2" y="5.5" width="8" height="1" fill="currentColor"/>
        </svg>
      </button>
      <button class="window-btn maximize" id="btnMaximize" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="window-btn close" id="btnClose" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar" id="tabBar">
    <div class="tabs-container" id="tabsContainer">
      <!-- Tabs will be inserted here -->
    </div>
    <button class="new-tab-btn" id="btnNewTab" title="New Tab (Ctrl+T)">
      <svg width="14" height="14" viewBox="0 0 14 14">
        <path d="M7 2 L7 12 M2 7 L12 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <div class="nav-buttons">
      <button class="nav-btn" id="btnBack" title="Back (Alt+Left)" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="nav-btn" id="btnForward" title="Forward (Alt+Right)" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="nav-btn" id="btnReload" title="Reload (Ctrl+R)">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path d="M13 8 A5 5 0 1 1 8 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M13 3 L13 8 L8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="address-bar-container">
      <div class="address-bar" id="addressBar">
        <svg class="address-icon" width="14" height="14" viewBox="0 0 14 14">
          <circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M9 9 L12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="addressInput" placeholder="Search or enter URL" spellcheck="false" autocomplete="off">
        <button class="bookmark-btn" id="btnBookmark" title="Add Bookmark">
          <svg width="14" height="14" viewBox="0 0 14 14">
            <path d="M7 2 L8.5 5 L12 5.5 L9.5 8 L10 12 L7 10 L4 12 L4.5 8 L2 5.5 L5.5 5 Z" fill="none" stroke="currentColor" stroke-width="1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="toolbar-actions">
      <button class="action-btn" id="btnZoomOut" title="Zoom Out (Ctrl+-)">
        <svg width="14" height="14" viewBox="0 0 14 14">
          <circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1"/>
          <path d="M4 6 L8 6" stroke="currentColor" stroke-width="1"/>
          <path d="M9 9 L12 12" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="action-btn" id="btnZoomIn" title="Zoom In (Ctrl++)">
        <svg width="14" height="14" viewBox="0 0 14 14">
          <circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1"/>
          <path d="M4 6 L8 6 M6 4 L6 8" stroke="currentColor" stroke-width="1"/>
          <path d="M9 9 L12 12" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="action-btn" id="btnFind" title="Find in Page (Ctrl+F)">
        <svg width="14" height="14" viewBox="0 0 14 14">
          <circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M9 9 L12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="action-btn" id="btnDevTools" title="Toggle DevTools (F12)">
        <svg width="14" height="14" viewBox="0 0 14 14">
          <path d="M5 3 L2 7 L5 11" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 3 L12 7 L9 11" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Find bar -->
  <div class="find-bar hidden" id="findBar">
    <input type="text" id="findInput" placeholder="Find in page...">
    <button class="find-btn" id="btnFindPrev" title="Previous">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <path d="M2 8 L6 4 L10 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="find-btn" id="btnFindNext" title="Next">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <path d="M2 4 L6 8 L10 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="find-btn close-find" id="btnCloseFindBar" title="Close">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
  </div>

  <!-- Bookmarks bar -->
  <div class="bookmarks-bar" id="bookmarksBar">
    <div class="bookmarks-container" id="bookmarksContainer">
      <!-- Bookmarks will be inserted here -->
    </div>
  </div>

  <!-- Main content area (webviews are added by the main process) -->
  <div class="content" id="content">
    <!-- Content managed by main process -->
  </div>

  <script src="../../dist/renderer/js/renderer.js"></script>
</body>
</html>
