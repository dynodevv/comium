<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.4);
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
    }
    
    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: rgba(15, 23, 42, 0.7);
        --text-muted: rgba(15, 23, 42, 0.4);
      }
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      -webkit-font-smoothing: antialiased;
    }
    
    .logo {
      margin-bottom: 40px;
      animation: fadeIn 0.6s ease;
    }
    
    .logo-text {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-color), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }
    
    .tagline {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 8px;
      text-align: center;
    }
    
    .shortcuts {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      max-width: 600px;
      animation: fadeIn 0.6s ease 0.2s both;
    }
    
    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 20px;
      width: 120px;
      background: var(--bg-secondary);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    
    .shortcut:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.1);
    }
    
    .shortcut-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: linear-gradient(135deg, var(--accent-color), #a855f7);
      color: white;
    }
    
    .shortcut-icon.google { background: linear-gradient(135deg, #4285f4, #34a853); }
    .shortcut-icon.youtube { background: linear-gradient(135deg, #ff0000, #ff4444); }
    .shortcut-icon.github { background: linear-gradient(135deg, #333, #666); }
    .shortcut-icon.twitter { background: linear-gradient(135deg, #1da1f2, #0077b5); }
    
    .shortcut-name {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
    }
    
    .keyboard-shortcuts {
      margin-top: 60px;
      text-align: center;
      animation: fadeIn 0.6s ease 0.4s both;
    }
    
    .keyboard-shortcuts h3 {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 24px;
      text-align: left;
    }
    
    .shortcut-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 0 6px;
      background: var(--bg-secondary);
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @media (max-width: 600px) {
      .logo-text {
        font-size: 36px;
      }
      
      .shortcuts {
        gap: 12px;
      }
      
      .shortcut {
        width: 100px;
        padding: 16px;
      }
      
      .shortcuts-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-text">Comium</div>
    <p class="tagline">A modern, minimal browser</p>
  </div>
  
  <div class="shortcuts">
    <a class="shortcut" href="https://www.google.com" title="Google">
      <div class="shortcut-icon google">G</div>
      <span class="shortcut-name">Google</span>
    </a>
    <a class="shortcut" href="https://www.youtube.com" title="YouTube">
      <div class="shortcut-icon youtube">▶</div>
      <span class="shortcut-name">YouTube</span>
    </a>
    <a class="shortcut" href="https://github.com" title="GitHub">
      <div class="shortcut-icon github">⌘</div>
      <span class="shortcut-name">GitHub</span>
    </a>
    <a class="shortcut" href="https://twitter.com" title="Twitter">
      <div class="shortcut-icon twitter">𝕏</div>
      <span class="shortcut-name">Twitter</span>
    </a>
  </div>
  
  <div class="keyboard-shortcuts">
    <h3>Keyboard Shortcuts</h3>
    <div class="shortcuts-grid">
      <div class="shortcut-item">
        <span class="key">Ctrl</span><span class="key">T</span>
        <span>New Tab</span>
      </div>
      <div class="shortcut-item">
        <span class="key">Ctrl</span><span class="key">W</span>
        <span>Close Tab</span>
      </div>
      <div class="shortcut-item">
        <span class="key">Ctrl</span><span class="key">L</span>
        <span>Focus Address Bar</span>
      </div>
      <div class="shortcut-item">
        <span class="key">Ctrl</span><span class="key">F</span>
        <span>Find in Page</span>
      </div>
      <div class="shortcut-item">
        <span class="key">Ctrl</span><span class="key">+</span>
        <span>Zoom In</span>
      </div>
      <div class="shortcut-item">
        <span class="key">Ctrl</span><span class="key">-</span>
        <span>Zoom Out</span>
      </div>
    </div>
  </div>
  
  <script>
    // Handle shortcut clicks
    document.querySelectorAll('.shortcut').forEach(shortcut => {
      shortcut.addEventListener('click', (e) => {
        e.preventDefault();
        const url = shortcut.getAttribute('href');
        // Use parent window's navigation if available
        if (window.location.href.includes('newtab.html')) {
          window.location.href = url;
        }
      });
    });
  </script>
</body>
</html>
